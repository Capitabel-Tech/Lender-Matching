name: Keep backend warm

# Render's free plan spins the backend down after ~15 minutes of no traffic,
# so the next real visitor has to wait 30s-2min for a cold start while the
# frontend (served instantly by Netlify) sits there with no data to show.
# Pinging /health every 5 minutes keeps it comfortably inside that window
# (even accounting for GitHub occasionally running a schedule a few minutes
# late) so it never actually goes to sleep. Free and unlimited since this
# repo is public — same reasoning as the ambak-rates scraper workflow.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production backend
        run: curl -sf https://lender-matching-engine.onrender.com/health || echo "production ping failed"

      - name: Ping staging backend
        run: curl -sf https://lender-matching-engine-staging.onrender.com/health || echo "staging ping failed"
